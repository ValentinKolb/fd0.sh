<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e0c"/>
      <stop offset="0.48" stop-color="#030504"/>
      <stop offset="1" stop-color="#080a09"/>
    </linearGradient>
    <linearGradient id="inset-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.24" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="amber-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd56d"/>
      <stop offset="0.3" stop-color="#ffbd27"/>
      <stop offset="0.72" stop-color="#ffad00"/>
      <stop offset="1" stop-color="#e88b00"/>
    </linearGradient>
    <linearGradient id="amber-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.24" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7b3d00" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="surface-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
  </defs>

  <rect x="63" y="63" width="898" height="898" rx="210" fill="#020302" filter="url(#surface-shadow)"/>
  <rect x="69" y="69" width="886" height="886" rx="204" fill="url(#surface)" stroke="#161a17" stroke-width="12"/>
  <rect x="82" y="82" width="860" height="860" rx="192" fill="none" stroke="url(#inset-edge)" stroke-width="10"/>
  <rect x="94" y="94" width="836" height="836" rx="180" fill="none" stroke="#000000" stroke-opacity="0.72" stroke-width="8"/>

  <g filter="url(#mark-shadow)">
    <rect x="252" y="260" width="520" height="520" fill="none" stroke="#9a5500" stroke-width="46" opacity="0.88"/>
    <circle cx="512" cy="520" r="89" fill="#9a5500" opacity="0.9"/>
    <rect x="252" y="252" width="520" height="520" fill="none" stroke="url(#amber-face)" stroke-width="44"/>
    <circle cx="512" cy="512" r="88" fill="url(#amber-face)"/>
    <rect x="255" y="255" width="514" height="514" fill="none" stroke="url(#amber-glass)" stroke-width="6" opacity="0.78"/>
    <circle cx="512" cy="512" r="84" fill="none" stroke="url(#amber-glass)" stroke-width="7" opacity="0.72"/>
  </g>
</svg>
