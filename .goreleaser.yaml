version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: fd0
    main: ./cmd/fd0
    binary: fd0
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: fd0-agent
    main: ./cmd/fd0-agent
    binary: fd0-agent
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: fd0-server
    main: ./cmd/fd0-server
    binary: fd0-server
    env: [CGO_ENABLED=0]
    flags: [-tags=netgo]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: fd0-bundle
    ids: [fd0, fd0-agent, fd0-server]
    name_template: "fd0_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - PROTOCOL.md
      - API.md
      - STORAGE.md
      - THREATS.md

dockers:
  - image_templates:
      - "ghcr.io/valentinkolb/fd0-server:{{ .Version }}"
      - "ghcr.io/valentinkolb/fd0-server:latest"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/ValentinKolb/fd0.sh"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: ValentinKolb
    name: fd0.sh
  draft: false
  prerelease: auto
