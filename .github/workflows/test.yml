name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: enforce release supply-chain policy
        run: |
          bash scripts/check-release-policy.sh
          cd desktop
          bun audit

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -5

  desktop-e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: test desktop app
        working-directory: desktop
        run: |
          bun run typecheck
          bun run test:e2e

      - name: upload desktop E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-diagnostics
          path: desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install package dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev xvfb

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: build Linux AppImage
        working-directory: desktop
        env:
          FD0_DESKTOP_VERSION: 0.0.0
          FD0_DESKTOP_FLAVOR: yubikey
          FD0_DESKTOP_PCSC_LIB: /usr/lib/x86_64-linux-gnu/libpcsclite.so.1
        run: |
          npm pkg set version=0.0.0
          bun run build
          bunx electron-builder --linux AppImage --x64 --publish never

      - name: verify Linux AppImage
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app=dist/fd0-desktop_0.0.0_linux_x86_64.AppImage
          test -x "$app"
          assert_output() {
            local label=$1 expected=$2 output status
            shift 2
            set +e
            output=$("$@" 2>&1)
            status=$?
            set -e
            if [[ "$status" -ne 0 || "$output" != "$expected" ]]; then
              echo "::error::$label failed with exit $status"
              printf 'expected: %s\nactual:   %s\n' "$expected" "$output"
              exit 1
            fi
          }
          assert_output "terminal runtime smoke" "fd0 terminal runtime ok" xvfb-run -a "$app" --fd0-terminal-runtime-smoke
          assert_output "desktop CLI relay" "fd0 0.0.0 yubikey" "$app" --fd0-cli-relay version

  yubikey-compile:
    # Compile-only job that exercises the `yubikey` build tag. We don't run
    # tests (they need a real card), we just want CI to fail loudly if the
    # tagged code regresses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install pcsclite
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: build with -tags=yubikey
        run: go build -tags=yubikey ./...
