name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -5

  yubikey-compile:
    # Compile-only job that exercises the `yubikey` build tag. We don't run
    # tests (they need a real card), we just want CI to fail loudly if the
    # tagged code regresses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install pcsclite
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: build with -tags=yubikey
        run: go build -tags=yubikey ./...
