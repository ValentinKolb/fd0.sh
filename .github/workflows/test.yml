name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: enforce release supply-chain policy
        run: |
          bash scripts/check-release-policy.sh
          cd desktop
          bun audit

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -5

  desktop-e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: test desktop app
        working-directory: desktop
        run: |
          node -e 'const fs = require("node:fs"); for (const path of ["node_modules/solid-js/dist/solid.js", "node_modules/solid-js/dist/solid.cjs"]) { const source = fs.readFileSync(path, "utf8"); fs.writeFileSync(path, source.replace("throw narrowedError(\"Show\")", "throw new Error(narrowedError(\"Show\"))")); }'
          bun run typecheck
          bun run test:e2e

      - name: upload desktop E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-diagnostics
          path: desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  yubikey-compile:
    # Compile-only job that exercises the `yubikey` build tag. We don't run
    # tests (they need a real card), we just want CI to fail loudly if the
    # tagged code regresses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install pcsclite
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: build with -tags=yubikey
        run: go build -tags=yubikey ./...
