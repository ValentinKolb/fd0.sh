# Docker-image release. Triggers on scoped per-component tags and on
# the coordinated `fd0-v*` tag that ships every component at once.
#
# Tag conventions:
#
#   server-v0.0.5    → builds fd0-server only
#   witness-v0.0.5   → builds fd0-witness only
#   website-v0.0.6   → builds fd0-website only
#   fd0-v0.1.0       → builds all three (coordinated wire-protocol bump)
#
# Image tags published — the component prefix is stripped so consumer
# compose files keep pulling `:0.0.5` and `:latest` exactly like before:
#
#   ghcr.io/<owner>/fd0-<service>:0.0.5         amd64
#   ghcr.io/<owner>/fd0-<service>:latest        amd64
#   ghcr.io/<owner>/fd0-<service>:0.0.5-arm64   arm64
#   ghcr.io/<owner>/fd0-<service>:latest-arm64  arm64

# Arm64 jobs run on `ubuntu-24.04-arm` (native arm64 host) so no qemu
# emulation is needed. Previous runs used `docker/setup-qemu-action`
# which intermittently failed when Docker Hub stalled on the
# `tonistiigi/binfmt` pull.

name: release-docker

on:
  push:
    tags:
      - "server-v*"
      - "witness-v*"
      - "website-v*"
      - "fd0-v*"

permissions:
  contents: read
  packages: write

jobs:
  # ─── fd0-server ──────────────────────────────────────────────────────
  fd0-server:
    if: startsWith(github.ref, 'refs/tags/server-v') || startsWith(github.ref, 'refs/tags/fd0-v')
    name: fd0-server (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          version="${version#v}"
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.platform }}" = "amd64" ]; then
            echo "tags=ghcr.io/${owner_lc}/fd0-server:${version},ghcr.io/${owner_lc}/fd0-server:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${owner_lc}/fd0-server:${version}-arm64,ghcr.io/${owner_lc}/fd0-server:latest-arm64" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./cmd/fd0-server/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=fd0-server-${{ matrix.platform }}
          cache-to: type=gha,scope=fd0-server-${{ matrix.platform }},mode=max

  # ─── fd0-witness ─────────────────────────────────────────────────────
  fd0-witness:
    if: startsWith(github.ref, 'refs/tags/witness-v') || startsWith(github.ref, 'refs/tags/fd0-v')
    name: fd0-witness (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          version="${version#v}"
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.platform }}" = "amd64" ]; then
            echo "tags=ghcr.io/${owner_lc}/fd0-witness:${version},ghcr.io/${owner_lc}/fd0-witness:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${owner_lc}/fd0-witness:${version}-arm64,ghcr.io/${owner_lc}/fd0-witness:latest-arm64" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./cmd/fd0-witness/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=fd0-witness-${{ matrix.platform }}
          cache-to: type=gha,scope=fd0-witness-${{ matrix.platform }},mode=max

  # ─── fd0-website ─────────────────────────────────────────────────────
  fd0-website:
    if: startsWith(github.ref, 'refs/tags/website-v') || startsWith(github.ref, 'refs/tags/fd0-v')
    name: fd0-website (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          version="${version#v}"
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.platform }}" = "amd64" ]; then
            echo "tags=ghcr.io/${owner_lc}/fd0-website:${version},ghcr.io/${owner_lc}/fd0-website:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${owner_lc}/fd0-website:${version}-arm64,ghcr.io/${owner_lc}/fd0-website:latest-arm64" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./website/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=fd0-website-${{ matrix.platform }}
          cache-to: type=gha,scope=fd0-website-${{ matrix.platform }},mode=max
