# Docker-image release. Triggers on scoped per-component tags and on
# the coordinated `fd0-v*` tag that ships every component at once.
#
# Tag conventions:
#
#   server-v0.0.5    → builds fd0-server only
#   witness-v0.0.5   → builds fd0-witness only
#   website-v0.0.6   → builds fd0-website only
#   fd0-v0.1.0       → builds all three (coordinated wire-protocol bump)
#
# Image tags published — the component prefix is stripped so consumer
# compose files keep pulling `:0.0.5` and `:latest` exactly like before:
#
#   ghcr.io/<owner>/fd0-<service>:0.0.5         amd64
#   ghcr.io/<owner>/fd0-<service>:latest        amd64
#   ghcr.io/<owner>/fd0-<service>:0.0.5-arm64   arm64
#   ghcr.io/<owner>/fd0-<service>:latest-arm64  arm64

name: release-docker

on:
  push:
    tags:
      - "server-v*"
      - "witness-v*"
      - "website-v*"
      - "fd0-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.service }} (${{ matrix.platform }})
    # Skip the matrix entries that do not match this tag. A `fd0-v*`
    # coordinated tag passes the filter for every service; per-component
    # tags pass only for their own service.
    if: |
      startsWith(github.ref, 'refs/tags/fd0-v') ||
      (matrix.service == 'fd0-server'  && startsWith(github.ref, 'refs/tags/server-v')) ||
      (matrix.service == 'fd0-witness' && startsWith(github.ref, 'refs/tags/witness-v')) ||
      (matrix.service == 'fd0-website' && startsWith(github.ref, 'refs/tags/website-v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [fd0-website, fd0-server, fd0-witness]
        platform: [amd64, arm64]
        include:
          - service: fd0-website
            context: ./website
            dockerfile: ./website/Dockerfile
          - service: fd0-server
            context: .
            dockerfile: ./cmd/fd0-server/Dockerfile
          - service: fd0-witness
            context: .
            dockerfile: ./cmd/fd0-witness/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          # Strip the "<component>-v" prefix (also handles a bare "v"
          # in case someone hand-pushes an old-style tag).
          version="${GITHUB_REF_NAME##*-v}"
          version="${version#v}"
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.platform }}" = "amd64" ]; then
            echo "tags=ghcr.io/${owner_lc}/${{ matrix.service }}:${version},ghcr.io/${owner_lc}/${{ matrix.service }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${owner_lc}/${{ matrix.service }}:${version}-arm64,ghcr.io/${owner_lc}/${{ matrix.service }}:latest-arm64" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'arm64'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }},mode=max
