name: release-desktop

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: test Go packages
        run: go test ./...

      - name: test desktop app
        working-directory: desktop
        run: |
          bun run typecheck
          bun run test:e2e

      - name: test desktop installer
        run: bash tests/run_isolated_integration.sh tests/integration_desktop_installer.sh

  macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            builder_arch: arm64
          - runner: macos-15-intel
            arch: x64
            builder_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: require Apple signing credentials
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name}" || { echo "::error::missing required secret $name"; exit 1; }
          done
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: set package version
        working-directory: desktop
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: build signed and notarized app
        working-directory: desktop
        env:
          FD0_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          FD0_DESKTOP_FLAVOR: yubikey
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run build
          bunx electron-builder --mac dmg zip --${{ matrix.builder_arch }} --publish never
          mv dist/latest-mac.yml "dist/${{ matrix.arch }}-mac.yml"

      - name: verify macOS bundle
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist -type d -name fd0.app -print -quit)
          test -n "$app"
          test "$("$app/Contents/Resources/bin/fd0" version)" = "fd0 ${{ steps.version.outputs.version }} yubikey"
          test "$("$app/Contents/Resources/bin/fd0-agent" --version)" = "fd0-agent ${{ steps.version.outputs.version }} yubikey"
          test "$("$app/Contents/MacOS/fd0" --fd0-cli-relay version)" = "fd0 ${{ steps.version.outputs.version }} yubikey"
          "$app/Contents/MacOS/fd0" --fd0-cli-relay update --check | grep -Fq "managed by fd0 Desktop"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          xcrun stapler validate "$app"

      - name: upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/${{ matrix.arch }}-mac.yml

  linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            builder_arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            builder_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev rpm

      - name: validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: set package version
        working-directory: desktop
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: build Linux packages
        working-directory: desktop
        env:
          FD0_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          FD0_DESKTOP_FLAVOR: yubikey
        run: |
          bun run build
          bunx electron-builder --linux AppImage deb rpm --${{ matrix.builder_arch }} --publish never

      - name: verify Linux bundle
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          rpm_package=$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$app" && test -n "$deb" && test -n "$rpm_package"
          test "$(APPIMAGE_EXTRACT_AND_RUN=1 "$app" --fd0-cli-relay version)" = "fd0 ${{ steps.version.outputs.version }} yubikey"
          APPIMAGE_EXTRACT_AND_RUN=1 "$app" --fd0-cli-relay update --check | grep -Fq "managed by fd0 Desktop"
          dpkg-deb -f "$deb" Depends | grep -Fq libpcsclite1
          rpm -qp --requires "$rpm_package" | grep -Fq pcsc-lite-libs

      - name: upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.blockmap
            desktop/dist/latest-linux*.yml

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: sign artifact manifest
        working-directory: release
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'checksums.txt*' -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > checksums.txt
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "fd0 Desktop $version" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
