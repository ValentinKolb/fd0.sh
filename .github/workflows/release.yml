# Client binary release. Triggers on scoped `client-v*` tags and on
# the coordinated `fd0-v*` tag. Goreleaser produces:
#   - per-platform tar.gz of fd0 + fd0-agent + fd0-server + fd0-witness
#   - checksums.txt with sha256 per archive
#   - checksums.txt.{sig,pem} for cosign verification (install.sh uses these)
#   - a GitHub Release at the actual tag (e.g. client-v0.0.5)
#
# .goreleaser.yaml strips the component prefix from the embedded
# `main.version` string so `fd0 version` prints just `0.0.5`.

name: release

on:
  push:
    tags:
      - "client-v*"
      - "fd0-v*"

permissions:
  contents: write
  packages: write
  id-token: write    # cosign keyless OIDC signing

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - name: ghcr login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Goreleaser internally parses `.Tag` as semver for GitHub Release
      # metadata, archive names, and changelog dedup. Our scoped tags
      # (`client-v0.2.0`, `fd0-v0.1.0`) fail that parse because they
      # carry a `<component>-v` prefix. We strip the prefix into a
      # local `v<MAJOR.MINOR.PATCH>` alias tag on the same commit and
      # point goreleaser at the alias for its parsing — but keep the
      # GitHub Release named after the original scoped tag via
      # release.name_template in .goreleaser.yaml.
      - name: derive semver alias tag
        id: semver
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#*-v}"           # client-v0.2.0 -> 0.2.0
          SEMVER="${SEMVER#v}"          # bare v0.2.0 still works
          if ! [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::could not derive semver from tag '$TAG'"
            exit 1
          fi
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          git tag "v$SEMVER" "$GITHUB_SHA"
          echo "aliased $TAG -> v$SEMVER (local only)"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin goreleaser to the v-prefixed alias so semver parsing
          # works. The GitHub Release name still uses the original
          # scoped tag via .goreleaser.yaml release.name_template.
          GORELEASER_CURRENT_TAG: v${{ steps.semver.outputs.semver }}
          # Surface the original scoped tag so the release-name template
          # can use it verbatim.
          ORIGINAL_TAG: ${{ github.ref_name }}
