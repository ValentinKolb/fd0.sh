<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!--
    fd0 OpenGraph card — 1200×630 (LinkedIn / Twitter / Slack default).
    Locked port-designation mark on the warm-amber-on-near-black brand
    palette. Designed to be rasterized via rsvg-convert at native size.
  -->
  <rect width="1200" height="630" fill="#0b0d0c"/>

  <!-- subtle radial wash to lift the surface a touch -->
  <defs>
    <radialGradient id="wash" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>

  <!-- top kicker -->
  <text x="80" y="115"
        font-family="Geist Mono, ui-monospace, monospace"
        font-size="18" letter-spacing="6" fill="#7c7e7a"
        text-transform="uppercase">FD0.SH · APACHE-2.0 · ZERO-KNOWLEDGE</text>

  <!-- logo mark — boxed 0xFD0 -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="280" height="80" fill="none" stroke="#ffb000" stroke-width="3"/>
    <text x="140" y="55" text-anchor="middle"
          font-family="Geist Mono, ui-monospace, monospace"
          font-size="42" font-weight="500" fill="#ffb000">0xFD0</text>
  </g>

  <!-- headline -->
  <text x="80" y="340"
        font-family="Geist, Inter, system-ui, sans-serif"
        font-size="88" font-weight="500" fill="#e8e6e0"
        letter-spacing="-2">Secrets you keep,</text>
  <text x="80" y="440"
        font-family="Geist, Inter, system-ui, sans-serif"
        font-size="88" font-weight="500" fill="#ffb000"
        letter-spacing="-2">not secrets you trust.</text>

  <!-- subhead -->
  <text x="80" y="520"
        font-family="Geist, Inter, system-ui, sans-serif"
        font-size="26" fill="#a3a39e">Zero-knowledge secrets manager · self-host or hosted at fd0.sh</text>

  <!-- footer bar -->
  <line x1="80" y1="565" x2="1120" y2="565" stroke="#23262521" stroke-width="1"/>

  <!-- 3 verifiable properties strip -->
  <g font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#7c7e7a">
    <text x="80"  y="595">CRYPTO  <tspan fill="#e8e6e0">Ed25519 · X25519</tspan></text>
    <text x="500" y="595">TRANSPARENCY  <tspan fill="#e8e6e0">RFC 6962 + witness</tspan></text>
    <text x="950" y="595">v1.0</text>
  </g>
</svg>
