# fd0-witness — minimal docker-compose deployment.
#
# Runs one fd0-witness watching one fd0-server. Listens on 4049/tcp.
# State on a named volume. No reverse proxy, no TLS — bring your own.
#
# Quick start:
#
#   umask 077
#   printf 'SERVER_URL=%s\n' 'https://api.fd0.sh' > .env
#   printf 'METRICS_TOKEN=%s\n' "$(openssl rand -hex 32)" >> .env
#   case "$(uname -m)" in arm64|aarch64) printf 'FD0_WITNESS_IMAGE=%s\n' 'ghcr.io/valentinkolb/fd0-witness:latest-arm64' >> .env ;; esac
#   docker compose up -d
#
# Health check:
#
#   curl http://localhost:4049/health
#
# First run TOFU-pins the server pubkey from /v1/server-info. Verify
# it matches the server's published pubkey out-of-band, otherwise a
# MITM at first contact pins the wrong key. For an independent
# witness watching a server you don't operate, set FD0_WITNESS_SERVER_PUB
# explicitly instead.

services:
  fd0-witness:
    # Override with FD0_WITNESS_IMAGE in .env.
    image: ${FD0_WITNESS_IMAGE:-ghcr.io/valentinkolb/fd0-witness:latest}
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:4049:4049"
    environment:
      # Required — the fd0-server this witness watches.
      FD0_WITNESS_SERVER_URL: ${SERVER_URL:?set SERVER_URL (e.g. https://api.fd0.sh)}

      # Required — guards GET /metrics. Generate with `openssl rand -hex 32`.
      FD0_WITNESS_METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}

      # Optional — defaults shown.
      # FD0_WITNESS_BIND: ":4049"                     # HTTP listen
      # FD0_WITNESS_DB: /data/witness.db              # SQLite archive
      # FD0_WITNESS_KEY: /data/cosign.key             # auto-generated
      # FD0_WITNESS_POLL_INTERVAL: "30s"
      # FD0_WITNESS_AUTO_DISCOVER: "true"             # poll /v1/chains every round
      # FD0_WITNESS_PIN_ON_FIRST_USE: "true"          # TOFU pin from /v1/server-info
      # FD0_WITNESS_SERVER_PUB: ""                    # hex (32 bytes); skips TOFU
      # FD0_WITNESS_CHAINS: ""                        # CSV "user:abc,scope:s_xyz"; skips auto-discover
    volumes:
      - fd0-witness-data:/data

volumes:
  fd0-witness-data:
