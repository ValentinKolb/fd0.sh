# fd0 — single-file deployment.
#
# Stack: Traefik + fd0-server + fd0-witness + fd0-website. Pure env —
# no inline configs, no side files. Three stack env vars (DOMAIN,
# ACME_EMAIL, METRICS_TOKEN) override the baked-in defaults; the
# images are hardcoded to ghcr.io/valentinkolb/fd0-* :latest.
#
#   fd0.sh          → fd0-website
#   api.fd0.sh      → fd0-server
#   witness.fd0.sh  → fd0-witness
#
# Quick deploy: `docker compose up -d`. Zero manual fields on first
# boot — the witness pins the server's pubkey on first contact (TOFU,
# SSH-style) and auto-discovers chains from /v1/chains.

services:

  # ─── Traefik — TLS termination + Host-based routing ───────────────────
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@fd0.sh}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks: [edge]

  # ─── fd0-server — data API at api.${DOMAIN} ───────────────────────────
  fd0-server:
    image: ghcr.io/valentinkolb/fd0-server:latest
    restart: unless-stopped
    environment:
      FD0_METRICS_TOKEN: ${METRICS_TOKEN:-CHANGE_ME_openssl_rand_hex_32}
      # ─── optional (uncomment to override binary defaults) ────────────
      # FD0_BIND: ":4048"                  # HTTP listen address
      # FD0_DB: /data/fd0.db               # SQLite path
      # FD0_MAX_BODY: "8388608"            # max request body (8 MB)
      # FD0_VERBOSE: "false"               # debug-level logging
      # ─── rate limiting (single-instance, per identity + per IP) ──────
      # FD0_RATELIMIT_OFF: "false"         # disable all rate limits
      # FD0_RATELIMIT_WRITES_PER_MIN: "60"        # authenticated writes/min/identity
      # FD0_RATELIMIT_BYTES_PER_MIN: "33554432"   # request body bytes/min/identity (32 MB)
      # FD0_RATELIMIT_REGISTER_PER_HOUR: "5"      # POST /v1/users per IP/hour
    volumes:
      - fd0-server-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.fd0-server.rule=Host(`api.${DOMAIN:-fd0.sh}`)
      - traefik.http.routers.fd0-server.entrypoints=websecure
      - traefik.http.routers.fd0-server.tls.certresolver=le
      - traefik.http.services.fd0-server.loadbalancer.server.port=4048
    networks: [edge]

  # ─── fd0-witness — public verifier at witness.${DOMAIN} ───────────────
  fd0-witness:
    image: ghcr.io/valentinkolb/fd0-witness:latest
    restart: unless-stopped
    depends_on:
      fd0-server:
        condition: service_started
    environment:
      FD0_WITNESS_METRICS_TOKEN: ${METRICS_TOKEN:-CHANGE_ME_openssl_rand_hex_32}
      # The server this witness watches. One witness watches one server
      # (process isolation). To watch a second server, copy this whole
      # service block. Use the internal docker DNS — no TLS overhead.
      FD0_WITNESS_SERVER_URL: http://fd0-server:4048
      # ─── optional (uncomment to override binary defaults) ────────────
      # FD0_WITNESS_DB: /data/witness.db         # SQLite archive
      # FD0_WITNESS_KEY: /data/cosign.key        # cosign key, auto-generated
      # FD0_WITNESS_BIND: ":4049"                # HTTP listen
      # FD0_WITNESS_PIN_ON_FIRST_USE: "true"     # TOFU pin from /v1/server-info
      # FD0_WITNESS_AUTO_DISCOVER: "true"        # poll /v1/chains every round
      # FD0_WITNESS_POLL_INTERVAL: "30s"
      # FD0_WITNESS_SERVER_PUB: ""               # hex (32 bytes); skips TOFU
      # FD0_WITNESS_CHAINS: ""                   # CSV "user:abc,scope:s_xyz"; skips auto-discover
      # FD0_WITNESS_VERBOSE: "false"
    volumes:
      - fd0-witness-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.fd0-witness.rule=Host(`witness.${DOMAIN:-fd0.sh}`)
      - traefik.http.routers.fd0-witness.entrypoints=websecure
      - traefik.http.routers.fd0-witness.tls.certresolver=le
      - traefik.http.services.fd0-witness.loadbalancer.server.port=4049
    networks: [edge]

  # ─── fd0-website — landing + /witness dashboard at ${DOMAIN} ──────────
  fd0-website:
    image: ghcr.io/valentinkolb/fd0-website:latest
    restart: unless-stopped
    depends_on:
      fd0-witness:
        condition: service_started
    environment:
      # The PUBLIC URL of the server — rendered in the UI so users see
      # where to point `fd0 sync`. Must match the public api.${DOMAIN}.
      FD0_SERVER_URL: https://api.${DOMAIN:-fd0.sh}
      FD0_WEBSITE_METRICS_TOKEN: ${METRICS_TOKEN:-CHANGE_ME_openssl_rand_hex_32}
      # ─── optional (uncomment to override binary defaults) ────────────
      # FD0_WITNESS_URL: http://fd0-witness:4049  # internal docker DNS; default already
      # PORT: "5173"                              # listen port; matches Dockerfile EXPOSE
      # NODE_ENV: "production"                    # set by the image already
      # FD0_WEBSITE_VERSION: "v1.0.0"             # shown on /version; baked at build time
    labels:
      - traefik.enable=true
      - traefik.http.routers.fd0-website.rule=Host(`${DOMAIN:-fd0.sh}`)
      - traefik.http.routers.fd0-website.entrypoints=websecure
      - traefik.http.routers.fd0-website.tls.certresolver=le
      - traefik.http.services.fd0-website.loadbalancer.server.port=5173
    networks: [edge]

volumes:
  traefik-letsencrypt:
  fd0-server-data:
  fd0-witness-data:

networks:
  edge:
    driver: bridge
