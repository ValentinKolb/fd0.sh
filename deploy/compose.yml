# fd0 — single-file deployment.
#
# Stack: Traefik + fd0-server + fd0-witness + fd0-website. Everything
# below — domain, ACME email, metrics token, witness config — lives in
# this one file. Three knobs (DOMAIN, ACME_EMAIL, METRICS_TOKEN) read
# from the host/Portainer/Coolify stack environment with sane defaults;
# the images are hardcoded to ghcr.io/valentinkolb/fd0-* :latest.
#
#   fd0.sh          → fd0-website
#   api.fd0.sh      → fd0-server
#   witness.fd0.sh  → fd0-witness
#
# Quick deploy: `docker compose up -d`. Zero manual fields after first
# boot: the witness pins the server's pubkey on first contact (TOFU,
# SSH-style) and auto-discovers chains from /v1/chains.

services:

  # ─── Traefik — TLS termination + Host-based routing ───────────────────
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@fd0.sh}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks: [edge]

  # ─── fd0-server — data API at api.${DOMAIN} ───────────────────────────
  fd0-server:
    image: ghcr.io/valentinkolb/fd0-server:latest
    restart: unless-stopped
    environment:
      FD0_BIND: ":4048"
      FD0_DB: /data/fd0.db
      FD0_METRICS_TOKEN: ${METRICS_TOKEN:-CHANGE_ME_openssl_rand_hex_32}
    volumes:
      - fd0-server-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4048/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.fd0-server.rule=Host(`api.${DOMAIN:-fd0.sh}`)
      - traefik.http.routers.fd0-server.entrypoints=websecure
      - traefik.http.routers.fd0-server.tls.certresolver=le
      - traefik.http.services.fd0-server.loadbalancer.server.port=4048
    networks: [edge]

  # ─── fd0-witness — public verifier at witness.${DOMAIN} ───────────────
  fd0-witness:
    image: ghcr.io/valentinkolb/fd0-witness:latest
    restart: unless-stopped
    depends_on:
      fd0-server:
        condition: service_healthy
    command:
      - --config=/etc/fd0-witness/witness.toml
      - --db=/data/witness.db
      - --key=/data/cosign.key
      - --bind=:4049
    environment:
      FD0_WITNESS_METRICS_TOKEN: ${METRICS_TOKEN:-CHANGE_ME_openssl_rand_hex_32}
    volumes:
      - fd0-witness-data:/data
    configs:
      - source: witness-config
        target: /etc/fd0-witness/witness.toml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4049/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.fd0-witness.rule=Host(`witness.${DOMAIN:-fd0.sh}`)
      - traefik.http.routers.fd0-witness.entrypoints=websecure
      - traefik.http.routers.fd0-witness.tls.certresolver=le
      - traefik.http.services.fd0-witness.loadbalancer.server.port=4049
    networks: [edge]

  # ─── fd0-website — landing + /witness dashboard at ${DOMAIN} ──────────
  fd0-website:
    image: ghcr.io/valentinkolb/fd0-website:latest
    restart: unless-stopped
    depends_on:
      fd0-witness:
        condition: service_started
    environment:
      # Public URL of the server — shown to users so they can point
      # `fd0 sync` at the right host.
      FD0_SERVER_URL: https://api.${DOMAIN:-fd0.sh}
      # Witness fetched server-side via the docker network — faster
      # than a TLS round-trip per page render. The "Verify yourself"
      # curls on /witness still display witness.${DOMAIN}.
      FD0_WITNESS_URL: http://fd0-witness:4049
      FD0_WEBSITE_METRICS_TOKEN: ${METRICS_TOKEN:-CHANGE_ME_openssl_rand_hex_32}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.fd0-website.rule=Host(`${DOMAIN:-fd0.sh}`)
      - traefik.http.routers.fd0-website.entrypoints=websecure
      - traefik.http.routers.fd0-website.tls.certresolver=le
      - traefik.http.services.fd0-website.loadbalancer.server.port=5173
    networks: [edge]

# ─── Inline witness config ──────────────────────────────────────────────
# Zero manual fields. The witness:
#
#   pin_on_first_use  — fetches /v1/server-info on first run, validates
#                       the self-signature, and pins whatever pubkey
#                       the server announced. SSH-known_hosts model.
#                       Any subsequent change → ErrPinMismatch.
#
#   auto_discover     — polls /v1/chains every round and watches every
#                       chain the server returns. New users and scopes
#                       are covered without intervention.
#
# Safe for self-host where one operator owns both server and witness
# (this stack). For an independent witness watching a third-party
# server, replace `pin_on_first_use = true` with an explicit
# `server_pub = "<hex>"` line — TOFU first-contact is otherwise
# subject to MITM. See deploy/README.md for the trust-model details.
#
# To inspect the pinned key after first run:
#   docker compose exec fd0-witness fd0-witness-status
# or query the witness store directly.
configs:
  witness-config:
    content: |
      [[target]]
      server_url       = "https://api.${DOMAIN:-fd0.sh}"
      poll_interval    = "30s"
      pin_on_first_use = true
      auto_discover    = true

volumes:
  traefik-letsencrypt:
  fd0-server-data:
  fd0-witness-data:

networks:
  edge:
    driver: bridge
